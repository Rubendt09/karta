config:
  target: "http://localhost:8080/api/v1"
  phases:
    - duration: 60
      arrivalRate: 1
  defaults:
    headers:
      Authorization: "Bearer {{ $processEnvironment.TOKEN }}"
      Content-Type: "application/json"
  processor: "./sse-processor.js"

scenarios:
  - name: "Chat SSE latency"
    flow:
      - post:
          url: "/projects/{{ $processEnvironment.PROJECT_ID }}/chat"
          json:
            message: "Resume los puntos principales del documento"
            documentIds:
              - "{{ $processEnvironment.DOCUMENT_ID }}"
            history: []
          capture:
            - regexp: "data: (.*)"
              as: "sse_data"
          afterResponse: "recordSseLatency"
